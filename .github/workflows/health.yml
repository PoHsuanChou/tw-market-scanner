# 資料健康檢查：每個平日掃描之後檢查一次。結果寫進 out/health.json，網站會顯示警告橫幅。
# 不再讓 job 失敗寄信（2026-11-04 停用：GitHub 排程延遲造成天天誤報）。
name: Data Health

on:
  schedule:
    - cron: '45 10 * * 1-5'   # UTC 10:45 = 台灣 18:45，掃描（17:30）之後 75 分鐘
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install requests pandas pyyaml

      - name: Check data health
        id: health
        continue-on-error: true   # 有問題也不讓整個 job 失敗（失敗會寄信）
        run: python -m scanner.health

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add out/health.json
          git diff --staged --quiet && echo "沒有變更需要 commit" && exit 0
          git commit -m "health $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase -q origin main
          git push
