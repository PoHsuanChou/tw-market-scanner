name: Daily Scan

on:
  schedule:
    - cron: '30 9 * * 1-5'   # UTC 09:30 = 台灣 17:30，平日（交易所與集保資料收盤後已出）
  workflow_dispatch:
    inputs:
      force_picks:
        description: '不是週五也產生推薦（測試用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Fetch, score, grade
        run: |
          if [ "${{ github.event.inputs.force_picks }}" = "true" ]; then
            python -m scanner.run_daily --force-picks
          else
            python -m scanner.run_daily
          fi

      # 網站總覽用的美股／台股／匯率、市場燈號與全部股票收盤價。Yahoo 抓不到時沿用上一次並標示，不讓整個 job 失敗
      - name: Market data for the site
        if: always()
        continue-on-error: true
        run: python -m scanner.market

      # 主題頁的「國外強度」（國外同類公司最近有沒有在漲）。只顯示、不影響推薦；Yahoo 抓不到時沿用上一次並標示
      - name: Foreign peers for themes
        if: always()
        continue-on-error: true
        run: python -m scanner.theme_peers

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add raw history out ledger
          git diff --staged --quiet && echo "沒有變更需要 commit" && exit 0
          git commit -m "scan $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase -q origin main
          git push
