# 所有門檻都在這裡。改任何數字都要改 version，ledger 每一筆都會記錄當時的版本，
# 回測才分得出「是哪一版規則做的判斷」。
version: "2026-10-25.3"

# 基準：加權指數（history/index/twii.csv，來源是證交所 MI_INDEX，2026-10-24 驗證過）。
# 指數歷史不足 21 天時退回「全部普通股 20 日報酬中位數」，輸出的 summary.benchmark 會標明用了哪一個。
# 上櫃股票也用加權指數當基準（櫃買指數來源尚未驗證）。
benchmark: twii

universe:
  # U.common_stock：4 碼數字、不以 0 開頭（排除 ETF）
  # U.liquidity：近 20 日（不足 20 日用現有天數）平均成交金額
  min_avg_turnover_billion: 0.5
  # U.focus：電子相關產業。名稱以 2026-10-22 實際資料為準（上市上櫃同名）。
  focus_industries: [半導體業, 電腦及週邊設備業, 光電業, 通信網路業, 電子零組件業, 電子通路業, 資訊服務業, 其他電子業]
  industry_alias: {金融保險業: 金融業}

signals:
  A:  # A.rs_and_ma：收盤在 20 日均線之上，且 20 日報酬高於基準
    ma_window: 20
    return_window: 20
  B:  # B.inst_5d：外資＋投信 5 日累計買超，且投信 5 日不為負
    window: 5
  C:  # C.tdcc_big：400 張以上占比比 4 週前上升且總人數下降；沒有集保歷史時用融資代理
    tdcc_weeks_back: 4
    tdcc_tolerance_days: 7
    proxy_window: 5          # C.margin_proxy：融資 5 日減少且 20 日報酬為正
  D:  # D.revenue：最新已公布月營收 YoY ≥ min_yoy，且較前月加速
    min_yoy: 20              # 前月 YoY 還沒有歷史時，改用「高於累計 YoY」代理，並在輸出標 d_basis

industry:
  member_share: 0.6          # 產業內該類成立的股票比例門檻
  min_known_stocks: 5        # 資料非空的股票至少幾檔，否則該類為 null
  delta_trading_days: 20

picks:
  weekly_max: 3              # 寄出的上限
  record_max: 10             # 每個版本寫進 ledger 的上限（含沒寄出的）
  # P.industry：2026-10-25 關閉。原因是規則本身幾乎不可能成立（每類訊號平均只有 30–40% 的股票成立，
  # 要求同產業 60% 同時成立，3 分以上在一年回放裡只出現 6 次），不是因為看了報酬。
  # 官方產業分類太粗（8 個電子產業的平均成立比例都在 0.31–0.36），產業分數改為只顯示、不擋。
  industry_gate: false
  min_industry_score: 3
  min_industry_delta: 2
  min_signals: 3             # P.signals（且 D 必須成立）
  max_margin_growth_5d_pct: 10   # P.no_trap：股價上漲同時融資 5 日增加超過此值
  variants:
    base:                    # 原本的規則，唯一會寄出的版本
      send: true
      max_r20_pct: 25        # P.not_priced：20 日已漲 ≥ 25% 不推薦
      sort_r20: asc          # 同訊號數時，優先還沒漲的
    momentum:                # 並行記錄、不寄出；pick_id 形如 2026-W43-M01
      send: false
      id_tag: M
      max_r20_pct: null      # 不排除已經漲的
      sort_r20: desc         # 同訊號數時，優先已經漲比較多的
    theme_swing_top3:        # 2026-10-25 加：只從「波段強主題的前 3 大」裡挑，其他關卡同 base；只記錄不寄出
      send: false
      id_tag: S
      universe: strong_theme_swing_top
      max_r20_pct: 25
      sort_r20: asc
    theme_top3:              # 2026-10-25 加：只從「強主題的前 3 大」裡挑，其他關卡同 base；只記錄不寄出
      send: false
      id_tag: T
      universe: strong_theme_top
      max_r20_pct: 25
      sort_r20: asc

# 細分主題（config/themes.yaml，reviewed 為 true 才在每日流程使用）
themes:
  member_min_signals: 3      # 成員有幾個以上訊號才算「強成員」；主題強 = 前 N 大裡強成員過半
  swing:                     # 波段版（網頁與通知預設用它）
    lookback_days: 10        # 看最近幾個交易日的訊號
    min_days_ratio: 0.5      # 至少一半的日子有 ≥ member_min_signals 個訊號，成員才算穩定
    min_known_days: 5        # 10 天裡至少要有幾天有資料，不足就是 null

grade:
  horizons: [5, 20, 60]
  # 評估基準：同一天 focus 範圍（電子相關、流動性過關）普通股報酬的「等權中位數」。
  # 不用加權指數當主要基準：它被大型權值股主導，中小型股平均起來幾乎一定落後，比較會失真。
  # 加權指數的報酬仍記在 bench_twii 欄位，僅供參考。報告看中位數與勝率，不看平均。
  benchmark: ew_median_focus
  min_bench_stocks: 30       # 當天 focus 股票少於這個數，基準記 null（不硬算）
