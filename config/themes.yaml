# =====================================================
# themes.yaml — 細分主題對照表（2026-10-25 定稿，第二版）
# =====================================================
# 用途：把股票分成細主題（MCU、散熱、被動元件…），每個主題只看「市值前 3 大」。
# 官方產業分類太粗（半導體業有 134 檔），看不出哪個次產業在動，所以改用這張表。
#
# 怎麼改：
#   - 刪掉不想看的股票或主題；加上你想看的（代號 + 名稱，名稱只是給人看的）
#   - 一檔股票可以屬於多個主題
#   - 主題少於 3 檔也可以，前 3 大就用現有的幾檔
#   - reviewed 為 true 時每日流程才會使用；改名單後請在下面「異動紀錄」記一筆，方便回測時分辨
#
# 第二版（2026-10-25）依使用者意見：記憶體拆成 DRAM／Flash／控制器模組三籃；矽晶圓與化合物半導體分開；
#   功率電感移出台達電；PSU 與 BBU 分開；光通訊拆成元件雷射／光纖陣列 CPO／光電封裝三層。
# 尚未處理：「TLVR／AI 伺服器供電」主題（要依產品與供應鏈證據列成員，目前沒有名單，所以先不建）。
#
# 註解裡的市值 = 2026-10-22 收盤價 × 發行股數，只是讓你參考大小。
# 程式實際上每週會用「當時」的市值重新排前 3 名，不是用這裡的順序。
# 標「[watchlist]」的主題由私人 repo config/watchlist.yaml 衍生；其他是依記憶列的候選，請特別確認。
# 所有代號與名稱都已和 2026-10-22 的交易所資料核對過。

# 異動紀錄：
#   2026-10-25 使用者定稿第二版，開始用真實資料記錄 theme_top3。
#     尚未處理：TLVR／AI 伺服器供電主題（沒有名單）、前鼎（4908）未列入、BMC 與高速銅纜成員不足 3 檔。
