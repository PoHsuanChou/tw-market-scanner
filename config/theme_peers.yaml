# =====================================================
# theme_peers.yaml — 主題的國外對照名單（「國外強度」用）
# =====================================================
# 用途：每個台股主題配「做一樣東西的國外公司」（美、日、韓、歐、中），看國外同類最近有沒有在漲。
# 只給網站主題頁顯示、記錄到 ledger/theme_peers.jsonl，不影響推薦。
#
# 怎麼改：
#   - 主題名稱要和 config/themes.yaml 一樣；ticker 用 Yahoo 的寫法（日股 .T、韓股 .KS、上海 .SS、深圳 .SZ）
#   - 不放同一家公司的 ADR（例如台積電 TSM、日月光 ASX）
#   - 找不到好對照的主題不列（目前是 BMC遠端管理晶片、機殼/滑軌）
#   - 改名單後在下面「異動紀錄」記一筆，並改 rules.yaml 的 version，回測才分得出是哪一版名單
#
# 回測（docs/status.md 2026-10-27）：國外強度 ≥ +5 的主題，之後 1 個月比其他主題多約 +3 個百分點。
# 名單是 2026-10-27 由 AI 助手依產品相似度列的，請使用者確認；列的時候已經知道哪些國外股票這兩年很紅，回測偏樂觀。
#
# 異動紀錄：
#   2026-10-27 第一版（25 個主題、62 檔）。QRVO 在 Yahoo 只剩 1 筆資料，化合物半導體實際上只有 SWKS。

